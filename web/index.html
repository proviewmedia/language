    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "EspTalk",
      "alternateName": "EspTalk — Survival Spanish Before Your Trip",
      "description": "Learn survival Spanish for your trip: airport, hotel, restaurant, directions, shopping, and emergencies. Free to start. $9.99 one-time for the full course.",
      "url": "https://esptalk.com/",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": [
        {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "name": "Free — First Words, Familiar Words, the 5 Magic Frames, and Eating & Drinking"
        },
        {
          "@type": "Offer",
          "price": "9.99",
          "priceCurrency": "USD",
          "name": "Pro — Full course, one-time payment"
        }
      ],
      "featureList": [
        "Survival Spanish for real travel scenarios: airport, transit, hotel, restaurant, shopping, directions, and emergencies",
        "Native-accent Latin American Spanish audio on every phrase",
        "Adjustable playback speed for slower listening practice",
        "Listen, repeat, and speak the phrase yourself — not multiple choice",
        "Offline support as an installable PWA",
        "Works without an account"
      ],
      "inLanguage": "en",
      "teaches": "Spanish language",
      "educationalLevel": "Beginner",
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student"
      }

    <!-- STRUCTURED DATA — FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Do I need any Spanish experience to start?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not at all. EspTalk starts from absolute zero. First words, first phrases, pronunciation from lesson one. It's designed for complete beginners who need practical Spanish fast."
          }
        },
        {
          "@type": "Question",
          "name": "How is EspTalk different from Duolingo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Duolingo is a subscription designed to keep you subscribed. EspTalk is a one-time purchase designed to get you speaking. Short lessons, real travel phrases, native-accent audio on everything, and a method built around saying it out loud — not tapping multiple choice."
          }
        },
        {
          "@type": "Question",
          "name": "Can I really learn useful Spanish in a week?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You won't be fluent, and we'd never claim that. But you can absolutely learn to greet people, order food, ask for directions, handle numbers, and navigate basic conversations. That's what survival Spanish means."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a subscription?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Pro is a one-time payment of $9.99. You pay once and own access forever — no monthly charges, no renewals, no cancellation traps."
          }
        },
        {
          "@type": "Question",
          "name": "Does EspTalk work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. EspTalk can be installed to your home screen as a PWA and used offline. Lessons, vocabulary, and phrasebooks all work without an internet connection — perfect for flights and travel."
          }
        }
      ]
    }
    </script>
